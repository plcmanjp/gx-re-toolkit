[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gx3-r-parser-toolkit"
version = "0.2.0"
description = "Read-only, fail-closed GX Works3 R04CPU Ladder parser"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
gx3-r-inspect = "gx3_r_parser_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gx3_r_parser_toolkit = ["schemas/*.json", "_provenance.json"]
