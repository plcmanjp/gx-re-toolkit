name: offline-package-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed-packages:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify normal installation
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/gx-env"
          $python = "$env:RUNNER_TEMP/gx-env/Scripts/python.exe"
          & $python -m pip install --require-hashes -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python tools/build_artifacts.py --output "$env:RUNNER_TEMP/gx-build"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheels = Get-ChildItem "$env:RUNNER_TEMP/gx-build/artifacts" -Recurse -Filter *.whl
          & $python -m pip install --no-deps $wheels.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $commit = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          & $python tools/verify_install.py --commit $commit --tree $tree --output "$env:RUNNER_TEMP/install-report.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archives = Get-ChildItem "$env:RUNNER_TEMP/gx-build/artifacts" -Recurse -File
          $arguments = @()
          foreach ($archive in $archives) { $arguments += '--artifact'; $arguments += $archive.FullName }
          & $python tools/audit_public_tree.py @arguments
          exit $LASTEXITCODE
  installed-linux-read-only:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify installed FX5/R read-only packages
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gx-env"
          python="$RUNNER_TEMP/gx-env/bin/python"
          "$python" -m pip install --require-hashes -r requirements-build.txt
          "$python" tools/build_artifacts.py --output "$RUNNER_TEMP/gx-build"
          "$python" -m pip install --no-deps "$RUNNER_TEMP"/gx-build/artifacts/packages/gx3-fx5/*.whl "$RUNNER_TEMP"/gx-build/artifacts/packages/gx3-r/*.whl
          "$python" -m pip check
          "$python" tools/verify_install.py --profiles fx5-r --commit "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')" --output "$RUNNER_TEMP/install-report.json"
          mapfile -d '' artifacts < <(find "$RUNNER_TEMP/gx-build/artifacts" -type f -print0)
          arguments=()
          for artifact in "${artifacts[@]}"; do arguments+=(--artifact "$artifact"); done
          "$python" tools/audit_public_tree.py "${arguments[@]}"
