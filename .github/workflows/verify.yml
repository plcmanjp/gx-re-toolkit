name: offline-package-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed-packages:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify normal installation
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/gx-env"
          $python = "$env:RUNNER_TEMP/gx-env/Scripts/python.exe"
          & $python -m pip install build==1.3.0 setuptools==84.0.0 olefile==0.47 pywin32==312
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python tools/build_artifacts.py --output "$env:RUNNER_TEMP/gx-build"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wheels = Get-ChildItem "$env:RUNNER_TEMP/gx-build/artifacts" -Recurse -Filter *.whl
          & $python -m pip install --no-deps $wheels.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $commit = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          & $python tools/verify_install.py --commit $commit --tree $tree --output "$env:RUNNER_TEMP/install-report.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archives = Get-ChildItem "$env:RUNNER_TEMP/gx-build/artifacts" -Recurse -File
          $arguments = @()
          foreach ($archive in $archives) { $arguments += '--artifact'; $arguments += $archive.FullName }
          & $python tools/audit_public_tree.py @arguments
          exit $LASTEXITCODE
