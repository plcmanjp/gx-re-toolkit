[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-re-lab"
version = "0.1.0"
description = "Offline, bounded research adapters for explicit GX project profiles"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "gx3-fx5-parser-toolkit==0.4.0",
  "gx3-r-parser-toolkit==0.2.0",
  "gxw-parser-toolkit==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gx_re_lab*"]
